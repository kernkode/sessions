# ─────────────────────────────────────────────────────────────────────────────
#  ~/.sessions/agents.toml — agentes CLI que la app puede lanzar.
#
#  El modelo, el proveedor y las claves los gestiona cada CLI en su propia
#  configuración; aquí solo se declara cómo lanzar el proceso.
#
#    id                identificador
#    command           ejecutable; command_windows / command_macos /
#                      command_linux permiten overrides por plataforma
#    args              argumentos base
#    resume_args       reanudar una sesión concreta; admite {session_id}
#    continue_args     continuar la última sesión del directorio
#    [agent.env]       variables fijas del proceso
#    metrics           claude-jsonl | codex-rollout | opencode-sqlite | pi-jsonl | none
#    metrics_path      ruta alternativa del origen de métricas
#    busy_hints        textos en la salida que indican "trabajando"
#    install           argv para instalar el CLI si falta (una vez, en 2.º plano)
# ─────────────────────────────────────────────────────────────────────────────

schema = 1

[[agent]]
id = "claude"
name = "Claude Code"
command = "claude"
command_windows = "claude.cmd"
# El harness corre los agentes sin supervisión: sin prompts de permisos.
args = ["--dangerously-skip-permissions"]
resume_args = ["--resume", "{session_id}"]
continue_args = ["--continue"]
install = ["npm", "install", "-g", "@anthropic-ai/claude-code"]
metrics = "claude-jsonl"
color = "#d97757"
# Además de los textos, los glifos del spinner que el TUI anima mientras
# trabaja (las versiones recientes ya no muestran «esc to interrupt»).
busy_hints = ["esc to interrupt", "Thinking", "Working", "✢", "✳", "✶", "✻", "✽"]

[agent.env]
FORCE_COLOR = "1"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"

[[agent]]
id = "codex"
name = "Codex CLI"
command = "codex"
command_windows = "codex.cmd"
args = []
resume_args = ["resume", "{session_id}"]
continue_args = ["resume", "--last"]
install = ["npm", "install", "-g", "@openai/codex"]
metrics = "codex-rollout"
color = "#10a37f"
busy_hints = ["Esc to interrupt", "Working", "thinking"]

[agent.env]
FORCE_COLOR = "1"

[[agent]]
id = "opencode"
name = "OpenCode"
command = "opencode"
command_windows = "opencode.exe"
args = []
resume_args = ["--session", "{session_id}"]
continue_args = ["--continue"]
install = ["npm", "install", "-g", "opencode-ai"]
metrics = "opencode-sqlite"
color = "#7c93ff"
busy_hints = ["working", "thinking"]

[agent.env]
FORCE_COLOR = "1"

[[agent]]
id = "pi"
name = "pi"
command = "pi"
args = []
resume_args = ["--session", "{session_id}"]
continue_args = ["--continue"]
# pi no vive en npm global; deja aquí su instalador si quieres auto-instalarlo.
# install = ["npm", "install", "-g", "<paquete-de-pi>"]
metrics = "pi-jsonl"
color = "#c678dd"

[agent.env]
FORCE_COLOR = "1"

# Terminal normal: útil para git, builds y comandos sueltos junto a los agentes.
[[agent]]
id = "shell"
name = "Terminal"
command = "bash"
command_windows = "powershell.exe"
command_macos = "zsh"
metrics = "none"
color = "#8a8f98"
