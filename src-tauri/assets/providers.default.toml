# ─────────────────────────────────────────────────────────────────────────────
#  ~/.sessions/providers.toml
#
#  Un proveedor = un endpoint + credenciales. Lo normal es que baste con esto:
#
#      [[provider]]
#      id = "mi-gateway"
#      kind = "openai-chat"          # decide qué CLI puede usarlo
#      base_url = "https://..."
#      api_key_env = "MI_API_KEY"
#      default_model = "modelo-a"
#
#      [[provider.model]]
#      id = "modelo-a"
#      context_window = 128000
#
#  Según `kind`, la app ya sabe qué variables y argumentos espera cada agente:
#
#      anthropic         → Claude Code (ANTHROPIC_BASE_URL / _AUTH_TOKEN / _MODEL)
#                          y OpenCode (ANTHROPIC_API_KEY)
#      openai-chat       → Codex, con overrides `-c model_providers.…` wire_api=chat
#      openai-responses  → Codex (wire_api=responses) y OpenCode
#      google            → Gemini CLI y OpenCode
#      ollama            → Codex (endpoint compatible con OpenAI)
#
#  Solo hay que escribir [provider.env.<agente>] o [provider.args] para añadir o
#  corregir algo puntual. Lo que pongas ahí gana sobre la plantilla, y una
#  variable con valor vacío ("") anula la heredada.
#
#  Campos del proveedor
#    id, name, kind, enabled
#    base_url
#    api_key            clave literal (evítalo si puedes)
#    api_key_env        leerla de una variable del entorno del host
#    api_key_file       leerla de un fichero (texto plano)
#    api_key_json_path  ruta dentro del JSON, p. ej. "gorouter.key"
#    api_key_command    comando cuyo stdout es la clave (pass, op, gopass…)
#    organization / project / region / api_version
#    timeout_ms, max_retries, headers
#    default_model, small_model
#    agents             lista blanca de agentes; vacío = los que permita el kind
#    notes
#
#  [[provider.model]]
#    id, name, remote_id, context_window, max_output_tokens,
#    reasoning, vision, tool_call, aliases, [provider.model.pricing]
#    pricing en USD por millón de tokens: input, output, cache_read, cache_write
#
#  Plantillas admitidas en env y args
#    {base_url} {api_key} {model} {model_id} {context_window}
#    {max_output_tokens} {small_model} {organization} {project} {region}
#    {api_version} {timeout_ms} {max_retries} {provider_id} {provider_name}
#    {env_var} {home}.  {{ y }} escapan llaves.
#    Si una plantilla no se puede resolver, esa variable no se pasa al proceso.
#
#  Todo esto se edita también desde Ajustes → Proveedores.
# ─────────────────────────────────────────────────────────────────────────────

schema = 1

# ═══════════════════════════════ Anthropic ═══════════════════════════════════
[[provider]]
id = "anthropic"
name = "Anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-4-5"
small_model = "claude-haiku-4-5"
timeout_ms = 600000
max_retries = 3

[[provider.model]]
id = "claude-opus-4-6"
name = "Claude Opus 4.6"
context_window = 200000
max_output_tokens = 64000
reasoning = true
vision = true
[provider.model.pricing]
input = 15.0
output = 75.0
cache_read = 1.5
cache_write = 18.75

[[provider.model]]
id = "claude-sonnet-4-5"
name = "Claude Sonnet 4.5"
context_window = 200000
max_output_tokens = 64000
reasoning = true
vision = true
aliases = ["sonnet"]
[provider.model.pricing]
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

[[provider.model]]
id = "claude-haiku-4-5"
name = "Claude Haiku 4.5"
context_window = 200000
max_output_tokens = 32000
vision = true
aliases = ["haiku"]
[provider.model.pricing]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 1.25

# OpenCode enruta por nombre de proveedor, así que necesita el modelo en el arg.
[provider.args]
opencode = ["--model", "anthropic/{model}"]

# ════════════════════════════════ OpenAI ═════════════════════════════════════
[[provider]]
id = "openai"
name = "OpenAI"
kind = "openai-responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-5.1-codex"
small_model = "gpt-5.1-codex-mini"

[[provider.model]]
id = "gpt-5.1-codex"
name = "GPT-5.1 Codex"
context_window = 272000
max_output_tokens = 128000
reasoning = true
vision = true
[provider.model.pricing]
input = 1.25
output = 10.0
cache_read = 0.125

[[provider.model]]
id = "gpt-5.1-codex-mini"
name = "GPT-5.1 Codex Mini"
context_window = 272000
max_output_tokens = 128000
reasoning = true
[provider.model.pricing]
input = 0.25
output = 2.0
cache_read = 0.025

# Codex ya trae OpenAI configurado de fábrica: basta con fijar el modelo.
[provider.args]
codex = ["-c", "model={model}"]
opencode = ["--model", "openai/{model}"]

# ════════════════════════════ Google Gemini ══════════════════════════════════
[[provider]]
id = "google"
name = "Google Gemini"
kind = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"
default_model = "gemini-3-pro"

[[provider.model]]
id = "gemini-3-pro"
name = "Gemini 3 Pro"
context_window = 1048576
max_output_tokens = 65536
reasoning = true
vision = true
[provider.model.pricing]
input = 1.25
output = 10.0

[[provider.model]]
id = "gemini-2.5-flash"
name = "Gemini 2.5 Flash"
context_window = 1048576
max_output_tokens = 65536
vision = true
[provider.model.pricing]
input = 0.3
output = 2.5

[provider.args]
opencode = ["--model", "google/{model}"]

# ═══════════════════════════════ OpenRouter ══════════════════════════════════
# Gateway compatible con OpenAI: sirve de plantilla para LiteLLM, vLLM,
# Together, Fireworks… Con `kind = "openai-chat"` ya funciona en Codex.
[[provider]]
id = "openrouter"
name = "OpenRouter"
kind = "openai-chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
default_model = "anthropic/claude-sonnet-4.5"

[provider.headers]
"HTTP-Referer" = "https://localhost/sessions"
"X-Title" = "Sessions"

[[provider.model]]
id = "anthropic/claude-sonnet-4.5"
name = "Sonnet 4.5 (OR)"
context_window = 200000
max_output_tokens = 64000
reasoning = true
vision = true

[[provider.model]]
id = "deepseek/deepseek-v3.2"
name = "DeepSeek V3.2 (OR)"
context_window = 163840
max_output_tokens = 65536
reasoning = true

# OpenCode trae OpenRouter integrado y usa su propia variable.
[provider.env.opencode]
OPENROUTER_API_KEY = "{api_key}"

[provider.args]
opencode = ["--model", "openrouter/{model}"]

# ═══════════════════════════════ DeepSeek ════════════════════════════════════
[[provider]]
id = "deepseek"
name = "DeepSeek"
kind = "openai-chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
default_model = "deepseek-chat"

[[provider.model]]
id = "deepseek-chat"
name = "DeepSeek Chat"
context_window = 163840
max_output_tokens = 65536
[provider.model.pricing]
input = 0.28
output = 0.42
cache_read = 0.028

[[provider.model]]
id = "deepseek-reasoner"
name = "DeepSeek Reasoner"
context_window = 163840
max_output_tokens = 65536
reasoning = true
[provider.model.pricing]
input = 0.28
output = 0.42

# DeepSeek ofrece además un endpoint compatible con Anthropic en /anthropic,
# así que también se puede usar con Claude Code.
[provider.env.claude]
ANTHROPIC_BASE_URL = "{base_url}/anthropic"
ANTHROPIC_AUTH_TOKEN = "{api_key}"
ANTHROPIC_MODEL = "{model}"

[provider.env.opencode]
DEEPSEEK_API_KEY = "{api_key}"

[provider.args]
opencode = ["--model", "deepseek/{model}"]

# ═══════════════════════════ Ollama (local) ══════════════════════════════════
[[provider]]
id = "ollama"
name = "Ollama (local)"
kind = "ollama"
base_url = "http://127.0.0.1:11434/v1"
api_key = "ollama"
default_model = "qwen3-coder:30b"
notes = "Endpoint compatible con OpenAI; Ollama no habla el protocolo de Anthropic."

[[provider.model]]
id = "qwen3-coder:30b"
name = "Qwen3 Coder 30B"
context_window = 262144
max_output_tokens = 32768
[provider.model.pricing]
input = 0.0
output = 0.0

[provider.env.all]
OLLAMA_HOST = "http://127.0.0.1:11434"

[provider.args]
opencode = ["--model", "ollama/{model}"]

# ═════════════════════ Plantilla: gateway propio ═════════════════════════════
# Copia este bloque y ajústalo. `enabled = false` lo mantiene fuera de la UI.
# No necesita bloques env ni args: los deduce de `kind`.
[[provider]]
id = "mi-gateway"
name = "Mi Gateway"
kind = "openai-chat"
enabled = false
base_url = "https://gateway.interno.local/v1"
api_key_command = "op read op://priv/gateway/credential"
default_model = "modelo-a"
timeout_ms = 300000
max_retries = 5
notes = "Ejemplo: clave leída de 1Password."

[provider.headers]
"X-Tenant" = "core"

[[provider.model]]
id = "modelo-a"
remote_id = "internal/model-a-2026"
context_window = 128000
max_output_tokens = 16384
reasoning = true
