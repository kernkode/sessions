[package]
name = "sessions"
version = "0.1.0"
description = "Consola multi-sesión para agentes CLI"
authors = ["KernKode"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sessions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"

portable-pty = "0.9"
parking_lot = "0.12"
crossbeam-channel = "0.5"

rusqlite = { version = "0.37", features = ["bundled"] }

dirs = "6"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
shell-words = "1"

[features]
default = []
# `tauri build` activa esta feature: sin ella el binario seguiría cargando el
# servidor de desarrollo en lugar de los assets empaquetados.
custom-protocol = ["tauri/custom-protocol"]

# Binario final pequeño y rápido.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 1
incremental = true
